services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_CONNECT_STRING: oracle:1521/XEPDB1
      UPLOAD_DIR: /app/uploads
    depends_on:
      oracle:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  oracle:
    image: gvenzl/oracle-xe:21-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      APP_USER: ${DB_USER:-gallery}
      APP_USER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
  uploads:
